pcm.multi {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "hw:0,0"
        slaves.a.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
    }
    ttable.0.0 0.33333
    ttable.1.1 0.33333
    ttable.2.0 0.33333
    ttable.3.1 0.33333
    ttable.4.0 0.33333
    ttable.5.1 0.33333
    ttable.6.2 0.33333
    ttable.7.3 0.33333
}

pcm.randomatones {
    type plug
    slave.pcm "multi"
}

